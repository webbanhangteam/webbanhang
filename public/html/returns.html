<!doctype html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tạo và theo dõi yêu cầu đổi trả theo từng đơn hàng tại Shop Anh Thuận.">
    <title>Đổi trả theo đơn hàng | Shop Anh Thuận</title>
    <link rel="icon" type="image/png" href="/image/logo-nonbg.png?v=5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/tailwind.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <header class="site-header sticky-top">
        <nav class="navbar navbar-light bg-white shadow-sm">
            <div class="container-fluid page-pad nav-shell">
                <a class="brand" href="/">
                    <img src="/image/logo.png" alt="">
                    <span>Shop Anh Thuận</span>
                </a>
                <div class="header-actions">
                    <a class="outline-btn page-link-button" href="/profile.html">Tài khoản</a>
                    <a class="outline-btn page-link-button" href="/return-policy.html">Chính sách</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="standalone-page">
        <section class="returns-page page-pad">
            <div class="detail-breadcrumb">
                <a href="/">Trang chủ</a><i class="bi bi-chevron-right"></i><span>Đổi trả</span>
            </div>

            <div id="returnsLoggedOut" class="account-band">
                <div>
                    <p>Đổi trả theo đơn hàng</p>
                    <h1>Đăng nhập để gửi yêu cầu đổi/trả.</h1>
                </div>
                <div class="account-tools">
                    <p id="accountStatus">Chưa đăng nhập</p>
                    <button class="black-btn" type="button" id="openAuthButton">Đăng nhập / Đăng ký</button>
                </div>
            </div>

            <div id="returnsPanel" class="returns-panel" hidden>
                <div class="returns-heading">
                    <div>
                        <p class="eyebrow">Trung tâm đổi trả</p>
                        <h1>Đổi/trả theo từng đơn hàng</h1>
                    </div>
                    <div class="returns-heading-actions">
                        <a class="outline-btn page-link-button" href="/profile.html">Xem tài khoản</a>
                        <button class="outline-btn" type="button" id="logoutButton">Đăng xuất</button>
                    </div>
                </div>

                <div class="returns-layout">
                    <form id="returnRequestForm" class="returns-form-card">
                        <h2><i class="bi bi-arrow-counterclockwise"></i> Tạo yêu cầu</h2>

                        <label>Đơn hàng
                            <select id="returnOrderSelect" required>
                                <option value="">Chọn đơn hàng</option>
                            </select>
                        </label>

                        <div id="returnSelectedOrderSummary" class="return-selected-order" hidden></div>

                        <label>Loại yêu cầu
                            <select id="returnRequestType" required>
                                <option value="return">Trả hàng</option>
                                <option value="exchange">Đổi hàng</option>
                            </select>
                        </label>

                        <label>Lý do
                            <textarea id="returnReason" rows="5" maxlength="2000" required
                                placeholder="Ví dụ: sai kích cỡ, lỗi sản phẩm, muốn đổi màu..."></textarea>
                        </label>

                        <button class="black-btn" type="submit" id="submitReturnRequestButton">
                            Gửi yêu cầu
                        </button>
                        <p id="returnsMessage" class="checkout-message"></p>
                    </form>

                    <section class="returns-orders-card" aria-labelledby="returnOrdersTitle">
                        <div class="history-head">
                            <h2 id="returnOrdersTitle">Đơn hàng của bạn</h2>
                            <button class="outline-btn" type="button" id="refreshReturnOrdersButton">Tải lại</button>
                        </div>
                        <div id="returnOrdersList" class="return-orders-list"></div>
                        <p id="returnOrdersMessage" class="checkout-message"></p>
                    </section>
                </div>
            </div>
        </section>
    </main>

    <div class="modal fade auth-modal" id="authModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body">
                    <div class="auth-form-side">
                        <button type="button" class="auth-close-btn" data-bs-dismiss="modal" aria-label="Đóng"><i
                                class="bi bi-x-lg"></i></button>
                        <h3 class="auth-form-title" id="authFormTitle">Đăng nhập</h3>
                        <p class="auth-form-subtitle" id="authFormSubtitle">Nhập thông tin tài khoản</p>
                        <div class="auth-tabs-v2"><button type="button" class="active" id="loginTabV2">Đăng
                                nhập</button><button type="button" id="registerTabV2">Đăng ký</button></div>
                        <div id="loginPaneV2" class="auth-pane active">
                            <form id="loginForm">
                                <div class="auth-input-group"><input id="loginUsername" type="text"
                                        placeholder="Tên đăng nhập" required><i class="bi bi-person"></i></div>
                                <div class="auth-input-group"><input id="loginPassword" type="password"
                                        placeholder="Mật khẩu" required><i class="bi bi-lock"></i><button type="button"
                                        class="password-toggle"><i class="bi bi-eye"></i></button></div><button
                                    class="auth-submit-btn" type="submit">Đăng nhập</button>
                                <p id="loginMessage" class="auth-message-v2"></p>
                            </form>
                        </div>
                        <div id="registerPaneV2" class="auth-pane">
                            <form id="registerForm">
                                <div class="auth-input-group"><input id="registerUsername" type="text"
                                        placeholder="Tên đăng nhập" required><i class="bi bi-person-plus"></i></div>
                                <div class="auth-input-group"><input id="registerPassword" type="password"
                                        placeholder="Mật khẩu" required><i class="bi bi-lock"></i><button type="button"
                                        class="password-toggle"><i class="bi bi-eye"></i></button></div><button
                                    class="auth-submit-btn" type="submit">Đăng ký</button>
                                <p id="registerMessage" class="auth-message-v2"></p>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/script.js"></script>
</body>

</html>
